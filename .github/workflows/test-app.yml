name: Time Study Desk app tests

on:
  push:
    branches: ["feat/time-study-desk-v1"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: time-study-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Archive the tested source
        shell: pwsh
        run: git archive --format=zip HEAD -o source-snapshot.zip
      - name: PowerShell syntax and encoding
        shell: powershell
        run: .\scripts\check-powershell-syntax.ps1
      - name: Build and verify both HTML variants
        shell: pwsh
        run: ./scripts/check-repository.ps1
      - name: Foundation acceptance tests
        run: node scripts/run-unit-tests.mjs
      - name: Upload source and build evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: time-study-evidence-${{ github.sha }}
          path: |
            source-snapshot.zip
            dist/
          retention-days: 7
          if-no-files-found: error
