name: One-time README screenshots (v1.0.0)

on:
  push:
    branches:
      - docs/readme-pdf-organizer-alignment
    paths:
      - .github/workflows/readme-screenshot-sync.yml

permissions:
  contents: write
  actions: read

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Get approved v1.0.0 CI captures
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p ci-screenshots
          gh run download 37871762507 \
            --repo "${{ github.repository }}" \
            --name time-study-evidence-1e51b1ee37de7e74ce987c15eb9a9a8b902eb14e \
            --dir ci-screenshots
          test -s ci-screenshots/test-results/screenshots/screenshot.png
          test -s ci-screenshots/test-results/screenshots/screenshot-en.png
          test -s ci-screenshots/test-results/screenshots/screenshot-mobile.png
          cp ci-screenshots/test-results/screenshots/screenshot.png assets/screenshot.png
          cp ci-screenshots/test-results/screenshots/screenshot-en.png assets/screenshot-en.png
          cp ci-screenshots/test-results/screenshots/screenshot-mobile.png assets/screenshot-mobile.png
          git add assets/screenshot.png assets/screenshot-en.png assets/screenshot-mobile.png
          git diff --cached --quiet && exit 0
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "docs: refresh README captures from v1.0.0 browser tests"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin "HEAD:${{ github.ref_name }}"
